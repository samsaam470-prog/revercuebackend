name = "revercue-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "revercue-db"
database_id = "60b39623-1fdc-4722-967d-ed36a82623b9"

# Public demo keyless provider: used only while no NaraRouter secret is set, so
# the Hugging Face Space keeps working. NaraRouter takes over the moment
# OPENROUTER_API_KEY exists.
[ai]
binding = "AI"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]

[vars]
ADMIN_USER = "abdullah"
B2_BUCKET_NAME = "revercue-files"
B2_KEY_ID = "00525f7d4d52f090000000001"
B2_S3_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
COOPER_INBOX_ID = "revercue@cooperemail.com"
FRONTEND_ORIGIN = "https://revercue.co.uk"
ALLOWED_ORIGINS = "https://revercue.co.uk,https://revercue.pages.dev,https://www.revercue.co.uk,https://revercue.com,https://www.revercue.com,https://adminrevercue.pages.dev"
# Canonical public API origin. AUTHACTION_AUDIENCE intentionally remains the
# existing API resource identifier; a custom hostname does not change it.
API_BASE_URL = "https://api.revercue.co.uk"
OPENMAIL_INBOX_ID = "b4b57d33-68fc-4227-8a0a-4ca47f56c4cd"
TURSO_URL = "libsql://revercue-auth-revercue.aws-ap-south-1.turso.io"

# AuthAction (non-secret identifiers only; the tenant is public metadata).
AUTHACTION_ISSUER = "https://revercue.in.authaction.com"
AUTHACTION_AUDIENCE = "revercue-api.samsaam470.workers.dev"
# Public SPA client identifier. Used only to reject ID tokens; never accepted
# in place of the API audience above.
AUTHACTION_CLIENT_ID = "OXJC1YmE3BwYU03xKfrMblC2F8hr9AC4"

# Transition switch: keep legacy email/password JWT auth working until the
# frontend has fully moved to AuthAction. Set to "false" to retire it.
ALLOW_LEGACY_AUTH = "true"


# Retention policy (invoices and fully signed contracts are never auto-deleted
# by default; see docs/DEPLOYMENT.md).
RETENTION_WARNING_DAYS = "10"
RETENTION_AUTO_DELETE_TYPES = "proposal,contract"

# Email retry/backoff and SSE resource limits.
EMAIL_MAX_ATTEMPTS = "5"
SSE_KEEPALIVE_SECONDS = "15"
SSE_MAX_SECONDS = "300"

# Whop billing (production).
WHOP_SANDBOX = "false"
APP_URL = "https://revercue.co.uk"
WHOP_PLAN_STARTER = "plan_dbw4JIFxq3zvB"
WHOP_PLAN_GROWTH_TRIAL = "plan_3NiOt8aRNQz7s"
WHOP_PLAN_GROWTH_STANDARD = "plan_W00KOQQvxNHkr"
WHOP_PLAN_SCALE = "plan_aDjtVgztfARgY"
WHOP_GROWTH_PROMO_START = "2026-11-23T00:00:00Z"
WHOP_GROWTH_PROMO_END = "2026-12-23T00:00:00Z"
# Public proposal demo (Hugging Face Space). The AI key is a secret
# (OPENROUTER_API_KEY, holding the NaraRouter key) and is never committed.
DEMO_ALLOWED_ORIGINS = "https://revercue-revercue-proposal-generator.static.hf.space,https://revercue-proposal-generator.static.hf.space"
BYNARA_API_ENDPOINT = "https://router.bynara.id/v1"
DEMO_AI_MODEL = "deepseek-v4-flash"
# Used by the keyless Workers AI fallback (see [ai] above). Override without a
# code change when Cloudflare retires a model.
DEMO_WORKERS_AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
DEMO_GENERATIONS_PER_HOUR = "4"
DEMO_EDITS_PER_HOUR = "25"
DEMO_MAX_BODY_BYTES = "32768"

